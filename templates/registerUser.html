<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <form method="post" action="/add_user" class="bg-white p-6 rounded-lg shadow w-80 space-y-4">

        <h2 class="text-xl font-semibold text-center">Create Account</h2>

        <div>
            <label class="block text-sm">Full Name</label>
            <input type="text" id="name" name="name" class="w-full border rounded px-2 py-1">
        </div>

        <div>
            <label class="block text-sm">Email</label>
            <input type="email" id="email" name="email" value="{{.Email}}" class="w-full border rounded px-2 py-1">
        </div>

        <div>
            <label class="block text-sm">Username</label>
            <input type="text" id="username" name="username" class="w-full border rounded px-2 py-1">
        </div>

        <div>
            <label class="block text-sm">Password</label>
            <input type="password" id="password" name="password" class="w-full border rounded px-2 py-1">
        </div>

        <div>
            <label class="block text-sm">Phone Number</label>
            <input type="number" id="phone" name="phone" class="w-full border rounded px-2 py-1">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-1.5 rounded hover:bg-blue-700">
            Submit
        </button>

        <a href="/login" class="block text-center text-sm text-blue-600 hover:underline">
            Login here if you have an account
        </a>

    </form>

</body>

</html>
