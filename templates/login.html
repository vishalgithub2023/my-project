<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <form action="http://localhost:8080/login" method="post"
    class="bg-white p-6 rounded-lg shadow w-80 space-y-4">

    <h2 class="text-xl font-semibold text-center">Login</h2>

    <div>
      <label class="block text-sm">Email</label>
      <input type="email" name="email" class="w-full border rounded px-2 py-1">
    </div>

    <div>
      <label class="block text-sm">Password</label>
      <input type="password" name="password" class="w-full border rounded px-2 py-1">
    </div>

    <button type="submit" name="action" value="login"
      class="w-full bg-blue-600 text-white py-1.5 rounded hover:bg-blue-700">Login</button>

    <a href="http://localhost:8080/add_user" target="_blank"
      class="block text-center text-sm text-blue-600 hover:underline">Register</a>
  </form>

</body>

</html>
